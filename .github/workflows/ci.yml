name: CI

on:
  push:
    branches: [dev, main, "feature/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Django checks
        run: python manage.py check --settings=config.settings.test
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests + coverage
        run: python -m pytest --cov=apps --cov-report=term-missing --cov-fail-under=80
      - name: Production settings check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          IP_HASH_SALT: ci-only-salt-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

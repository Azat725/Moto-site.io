name: ${COMPOSE_PROJECT_NAME:-ivax}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-application: &application
  image: ivax-moto:${IVAX_IMAGE_TAG:-local}
  build: .
  env_file: ${IVAX_ENV_FILE:-.env}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_DEBUG: "false"
    DATA_DIR: /srv/ivax/data
    MEDIA_ROOT: /srv/ivax/media
    BACKUP_DIR: /srv/ivax/backups
    TRUSTED_PROXY: "true"
    TRUSTED_PROXY_IPS: ${CADDY_CONTAINER_IP:-172.30.61.2}
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  networks: [site]

services:
  init:
    <<: *application
    command: [python, manage.py, prepare_container]
    restart: "no"
    volumes:
      - data:/srv/ivax/data
      - media:/srv/ivax/media
      - backups:/srv/ivax/backups
      - staticfiles:/srv/ivax/app/staticfiles

  web:
    <<: *application
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - data:/srv/ivax/data
      - media:/srv/ivax/media
      - staticfiles:/srv/ivax/app/staticfiles:ro
    healthcheck:
      test: [CMD, python, deploy/docker/healthcheck.py]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 6
    stop_grace_period: 40s

  notify:
    <<: *application
    command: [python, manage.py, send_notifications, --loop, --interval, "5"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - data:/srv/ivax/data
      - staticfiles:/srv/ivax/app/staticfiles:ro
    stop_grace_period: 40s

  maintenance:
    <<: *application
    command: [python, manage.py, run_maintenance]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - data:/srv/ivax/data
      - media:/srv/ivax/media:ro
      - backups:/srv/ivax/backups
      - staticfiles:/srv/ivax/app/staticfiles:ro
    stop_grace_period: 40s

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    entrypoint: [sh, /etc/caddy/entrypoint.sh]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      ADMIN_PATH: ${ADMIN_PATH:?Заполните ADMIN_PATH в .env}
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:-${SITE_DOMAIN:?Заполните SITE_DOMAIN в .env}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/caddy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - media:/srv/ivax/media:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    group_add: ["10001"]
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      site:
        ipv4_address: ${CADDY_CONTAINER_IP:-172.30.61.2}

networks:
  site:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.61.0/24}
          ip_range: ${DOCKER_DYNAMIC_RANGE:-172.30.61.128/25}

volumes:
  data:
  media:
  backups:
  staticfiles:
  caddy_data:
  caddy_config:

<!-- Прелоадер-тахометр / шторка перехода между страницами -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <svg class="tacho" viewBox="0 0 200 200" focusable="false">
        <path class="track" d="M43.43 156.57A80 80 0 1 1 156.57 156.57"/>
        <path class="ticks" pathLength="100" d="M53.34 146.66A66 66 0 1 1 146.66 146.66"/>
        <path class="zone" d="M179.01 87.49A80 80 0 0 1 156.57 156.57"/>
        <text x="100" y="146">× 1000 RPM</text>
        <g class="needle"><line x1="100" y1="100" x2="100" y2="34"/></g>
        <circle class="hub" cx="100" cy="100" r="9"/>
      </svg>
      <div class="preloader__logo">{{site.brandHtml}}</div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
